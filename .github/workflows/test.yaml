---

name: Test

on:
  pull_request:
    types:
      - synchronize
      - opened
      - reopened
      - ready_for_review

jobs:
  test:
    if: github.event.pull_request.draft == false

    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The ubuntu-24.04 image has no Haskell tools. Stack installs the GHC of
      # the resolver, so skip the global GHC.
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2.12.1
        with:
          enable-stack: true
          stack-no-global: true

      # Github actions L1 cache
      - name: stack home cache
        id: cache-home-stack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.stack
          key: ${{ runner.os }}-home-stack-${{ hashFiles('stack.yaml.lock') }}
          restore-keys: |
            ${{ runner.os }}-home-stack-

      - name: stack work cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cache-stack-work
        with:
          path: |
            **/.stack-work
          key: ${{ runner.os }}-stack-work-${{ hashFiles('stack.yaml.lock') }}-${{ hashFiles('aws-ec2-knownhosts.cabal') }}
          restore-keys: |
            ${{ runner.os }}-stack-work-${{ hashFiles('stack.yaml.lock') }}-
            ${{ runner.os }}-stack-work-

      # Build
      - name: stack build
        run: |
          stack build --test --bench --no-run-tests --no-run-benchmarks --ghc-options="+RTS -A256m -I0 -RTS" --no-interleaved-output

      # Test
      - name: stack test
        run: |
          stack test --ghc-options="+RTS -A256m -I0 -RTS" --no-interleaved-output


